[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-res-forecast-climate"
version = "0.1.0"
description = "Probabilistic day-ahead to week-ahead wind and solar generation forecast for Poland from open ensemble weather forecasts, verified against PSE data, plus an ERA5 resource climatology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=14",
    "scipy>=1.11",
    "requests>=2.31",
    "pvlib>=0.11",
    "matplotlib>=3.8",
    "pse-opendata>=0.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
res-forecast = "res_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
res_forecast = ["data/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
